
name: Build Arnala Boat Android Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "arnala_boat/**"
      - ".github/workflows/build-tracker.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: arnala_boat
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: arnala_boat
        run: flutter analyze

      - name: Build Android APK
        working-directory: arnala_boat
        run: flutter build apk --release -t lib/tracker_main.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arnala-Boat-Tracker-Android
          path: arnala_boat/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
